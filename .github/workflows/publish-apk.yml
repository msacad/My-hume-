name: Build and Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Vite & Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Android Debug APK with Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Compiled APK not found at $APK_PATH"
            exit 1
          fi
          echo "Verifying APK integrity..."
          unzip -tq "$APK_PATH"
          mkdir -p apk-distribution
          cp "$APK_PATH" apk-distribution/app-debug.apk
          sha256sum apk-distribution/app-debug.apk > apk-distribution/app-debug.apk.sha256

      - name: Create GitHub Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Somaliland Driving Simulator Debug APK (Build #${{ github.run_number }}.${{ github.run_attempt }})"

          echo "Creating GitHub Release: ${TAG_NAME}"
          gh release create "${TAG_NAME}" \
            "apk-distribution/app-debug.apk" \
            --title "${RELEASE_TITLE}" \
            --notes "Automated build and release of Somaliland Driving Simulator debug APK from source." \
            --latest

          APK_SIZE=$(ls -lh apk-distribution/app-debug.apk | awk '{print $5}')
          APK_SHA=$(cat apk-distribution/app-debug.apk.sha256 | awk '{print $1}')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          DIRECT_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          echo "## APK Auto-Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** ${APK_SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`${APK_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page:** [View Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download:** [Download app-debug.apk](${DIRECT_DOWNLOAD_URL})" >> $GITHUB_STEP_SUMMARY
