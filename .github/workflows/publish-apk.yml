name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish APK to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          if [ ! -f "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk does not exist!"
            exit 1
          fi

          if [ ! -s "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk is empty!"
            exit 1
          fi

          if [ ! -f "apk-distribution/app-debug.apk.sha256" ]; then
            echo "::error::apk-distribution/app-debug.apk.sha256 does not exist!"
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          echo "Verifying ZIP archive integrity..."
          unzip -tq apk-distribution/app-debug.apk

          echo "APK validation passed successfully."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Somaliland Driving Simulator Debug APK (Build #${{ github.run_number }}.${{ github.run_attempt }})"

          echo "Creating GitHub Release with tag: ${TAG_NAME}"
          gh release create "${TAG_NAME}" \
            "apk-distribution/app-debug.apk" \
            --title "${RELEASE_TITLE}" \
            --notes "Automated release of genuine compiled debug APK for Somaliland Driving Simulator." \
            --latest

          APK_SIZE=$(ls -lh apk-distribution/app-debug.apk | awk '{print $5}')
          APK_SHA=$(cat apk-distribution/app-debug.apk.sha256 | awk '{print $1}')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          DIRECT_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          echo "## APK Distribution Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** ${APK_SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`${APK_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page:** [View Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download:** [Download app-debug.apk](${DIRECT_DOWNLOAD_URL})" >> $GITHUB_STEP_SUMMARY
